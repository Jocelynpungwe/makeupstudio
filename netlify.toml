# Netlify build settings. Vite 8 needs Node 20.19+ or 22.12+, so the version is pinned here
# (Netlify's default can be older, which produces confusing build errors).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Long-lived caching for the hashed build output and the optimised media
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Single-page app fallback is handled by public/_redirects ("/* /index.html 200").
