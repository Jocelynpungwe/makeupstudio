<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#332724" />
    <style>
      /* critical: the poster paints from HTML before any script runs */
      html,body{margin:0;background:#221917}
      #boot{position:fixed;inset:0 0 2px 0;z-index:0;pointer-events:none;background:#221917}
      #root{position:relative;z-index:1}
      html[data-hero-mode="static"] #boot{display:none}
      #boot img{display:block;width:100%;height:100%;object-fit:cover}
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Maison Amara | Luxury Makeup Artistry in Toronto</title>
    <meta
      name="description"
      content="Luxury makeup atelier in Toronto: soft glam, full glam, bridal and editorial makeup, with colour matched to your skin and undertone. Request your appointment online."
    />
    <link rel="canonical" href="https://www.maisonamara.ca/" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:site_name" content="Maison Amara" />
    <meta property="og:title" content="Maison Amara | Luxury Makeup Artistry in Toronto" />
    <meta
      property="og:description"
      content="Soft glam, full glam, bridal and editorial makeup, colour matched to your skin and undertone."
    />
    <meta property="og:url" content="https://www.maisonamara.ca/" />
    <meta property="og:image" content="https://www.maisonamara.ca/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Close-up of a finished makeup look with glowing skin and a bronze lip" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- LCP: the hero poster paints before any script runs. Only the matching viewport downloads. -->
    <link
      rel="preload"
      as="image"
      href="/media/hero/hero-poster-1920.webp"
      type="image/webp"
      media="(min-width: 721px) and (orientation: landscape)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/media/hero/hero-poster-mobile.webp"
      type="image/webp"
      media="(max-width: 720px), (orientation: portrait)"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="boot" aria-hidden="true">
        <picture>
          <source media="(max-width: 720px), (orientation: portrait) and (max-width: 1024px), (orientation: portrait) and (pointer: coarse), (orientation: landscape) and (pointer: coarse) and (max-height: 560px)" srcset="/media/hero/hero-poster-mobile.webp" />
          <img src="/media/hero/hero-poster-1920.webp" alt="" width="1920" height="1080" fetchpriority="high" decoding="async" />
        </picture>
      </div>
    <div id="root"></div>
    <noscript>
      <p style="padding:2rem;font-family:Georgia,serif">
        Maison Amara is a luxury makeup atelier in Toronto, Ontario. Call +1 (416) 555-0142 or email hello@maisonamara.ca. This site works best with JavaScript enabled.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
